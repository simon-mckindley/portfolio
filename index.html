<script>
  const savedTheme = localStorage.getItem("portfolio-theme");

  const theme = savedTheme === "light" || savedTheme === "dark"
    ? savedTheme
    : window.matchMedia("(prefers-color-scheme: dark)").matches
      ? "dark"
      : "light";

  document.body.setAttribute("data-theme", theme);
</script>
